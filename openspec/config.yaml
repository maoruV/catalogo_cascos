# openspec/config.yaml
schema: spec-driven

context: |
  Stack: Python 3.13, Django 6.0.6, SQLite
  Package manager: uv
  Project: Fresh django-admin startproject output — no apps created yet
  Architecture: Monolithic Django project (config/ package)
  Testing: Django TestCase via manage.py test; no pytest, coverage, linter, type checker, or formatter installed
  Style: Default Django project layout with pyproject.toml

strict_tdd: true

testing:
  runner: django (manage.py test)
  layers:
    - unit (Django TestCase)
    - integration (Django TestCase — database-backed)
  coverage: false
  linter: false
  type_checker: false
  formatter: false

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    - Follow existing code patterns
    tdd: true
    test_command: "python manage.py test"
  verify:
    test_command: "python manage.py test"
    build_command: "python manage.py check"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
