<div id="product-grid">
    {% if product_list %}
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            {% for product in product_list %}
                {% include "catalog/partials/_product_card.html" %}
            {% endfor %}
        </div>
    {% else %}
        <div class="text-center py-16 px-4">
            <svg class="w-16 h-16 text-gray-300 mx-auto mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1">
                <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"/>
            </svg>
            <p class="text-lg font-medium text-gray-500">No se encontraron productos</p>
            <p class="text-sm text-gray-400 mt-1">Intentá con otros filtros o términos de búsqueda</p>
        </div>
    {% endif %}
</div>

{% include "catalog/partials/_pagination.html" %}
