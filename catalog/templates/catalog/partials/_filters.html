<form hx-get="{% url 'catalog:product_list' %}" hx-trigger="change from:#categoria-select" hx-target="#product-grid"
      class="bg-white border border-gray-200 rounded-xl p-4 sm:p-5 shadow-sm">
    <div class="flex flex-wrap items-end gap-4">

        <!-- Custom Category Dropdown -->
        <div class="flex-1 min-w-[160px] dropdown-container relative">
            <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1.5">Categoría</label>

            <!-- Hidden real select (for HTMX) -->
            <select name="categoria" id="categoria-select" class="hidden" aria-hidden="true">
                <option value="">Todas las categorías</option>
                {% for cat in categories %}
                    <option value="{{ cat.pk }}" {% if categoria == cat.pk|stringformat:"s" %}selected{% endif %}>{{ cat.name }}</option>
                {% endfor %}
            </select>

            <!-- Custom dropdown trigger -->
            <button type="button"
                    onclick="toggleDropdown('categoria-menu')"
                    class="w-full flex items-center justify-between gap-2 px-3 py-2.5 bg-gray-50 border border-gray-200 rounded-lg text-sm text-gray-700
                           hover:border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500 transition-colors cursor-pointer">
                <span id="categoria-menu-label" class="truncate">
                    {% if categoria %}
                        {% for cat in categories %}{% if categoria == cat.pk|stringformat:"s" %}{{ cat.name }}{% endif %}{% endfor %}
                    {% else %}
                        Todas las categorías
                    {% endif %}
                </span>
                <svg class="w-4 h-4 text-gray-400 shrink-0 transition-transform" id="categoria-menu-arrow" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5"/>
                </svg>
            </button>

            <!-- Dropdown list -->
            <div id="categoria-menu"
                 class="dropdown-menu hidden absolute z-20 mt-1 left-0 right-0 max-h-48 overflow-y-auto rounded-xl bg-white shadow-lg border border-gray-200 py-1">
                <button type="button"
                        onclick="selectOption('categoria-select', '', 'Todas las categorías', 'categoria-menu')"
                        class="w-full text-left px-4 py-2.5 text-sm hover:bg-blue-50 hover:text-blue-700 transition-colors
                               {% if not categoria %}bg-blue-50 text-blue-700 font-semibold{% else %}text-gray-700{% endif %}">
                    Todas las categorías
                </button>
                {% for cat in categories %}
                <button type="button"
                        onclick="selectOption('categoria-select', '{{ cat.pk }}', '{{ cat.name|escapejs }}', 'categoria-menu')"
                        class="w-full text-left px-4 py-2.5 text-sm hover:bg-blue-50 hover:text-blue-700 transition-colors
                               {% if categoria == cat.pk|stringformat:"s" %}bg-blue-50 text-blue-700 font-semibold{% else %}text-gray-700{% endif %}">
                    {{ cat.name }}
                </button>
                {% endfor %}
            </div>
        </div>

        <!-- Price fields -->
        <div class="flex-1 min-w-[130px]">
            <label for="precio_min" class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1.5">Precio mín</label>
            <input type="number" name="precio_min" id="precio_min" value="{{ precio_min }}"
                   placeholder="$0" step="0.01"
                   hx-get="{% url 'catalog:product_list' %}" hx-trigger="change" hx-target="#product-grid"
                   class="w-full px-3 py-2.5 bg-gray-50 border border-gray-200 rounded-lg text-sm text-gray-700
                          focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500
                          hover:border-gray-300 transition-colors
                          [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none">
        </div>
        <div class="flex-1 min-w-[130px]">
            <label for="precio_max" class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1.5">Precio máx</label>
            <input type="number" name="precio_max" id="precio_max" value="{{ precio_max }}"
                   placeholder="$9999" step="0.01"
                   hx-get="{% url 'catalog:product_list' %}" hx-trigger="change" hx-target="#product-grid"
                   class="w-full px-3 py-2.5 bg-gray-50 border border-gray-200 rounded-lg text-sm text-gray-700
                          focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500
                          hover:border-gray-300 transition-colors
                          [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none">
        </div>

        <!-- Clear -->
        <div class="flex items-center gap-2 pb-0.5">
            <button type="reset"
                    class="px-4 py-2.5 text-sm font-medium text-gray-500 hover:text-gray-700 hover:bg-gray-100 rounded-lg transition-colors"
                    onclick="var f=this.closest('form'); f.querySelectorAll('input[type=number]').forEach(function(i){i.value=''}); selectOption('categoria-select', '', 'Todas las categorías', 'categoria-menu');">
                Limpiar
            </button>
        </div>
    </div>
</form>
