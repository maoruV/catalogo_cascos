<form hx-get="{% url 'catalog:product_list' %}" hx-trigger="change" hx-target="#product-grid"
      class="bg-white border border-gray-200 rounded-xl p-4 sm:p-5 shadow-sm">
    <div class="flex flex-wrap items-end gap-4">
        <div class="flex-1 min-w-[160px]">
            <label for="categoria" class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1.5">Categoría</label>
            <select name="categoria" id="categoria"
                    class="w-full px-3 py-2.5 bg-gray-50 border border-gray-200 rounded-lg text-sm text-gray-700
                           focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500
                           hover:border-gray-300 transition-colors cursor-pointer">
                <option value="">Todas las categorías</option>
                {% for cat in categories %}
                    <option value="{{ cat.pk }}" {% if categoria == cat.pk|stringformat:"s" %}selected{% endif %}>{{ cat.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="flex-1 min-w-[130px]">
            <label for="precio_min" class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1.5">Precio mín</label>
            <input type="number" name="precio_min" id="precio_min" value="{{ precio_min }}"
                   placeholder="$0" step="0.01"
                   class="w-full px-3 py-2.5 bg-gray-50 border border-gray-200 rounded-lg text-sm text-gray-700
                          focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500
                          hover:border-gray-300 transition-colors
                          [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none">
        </div>
        <div class="flex-1 min-w-[130px]">
            <label for="precio_max" class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1.5">Precio máx</label>
            <input type="number" name="precio_max" id="precio_max" value="{{ precio_max }}"
                   placeholder="$9999" step="0.01"
                   class="w-full px-3 py-2.5 bg-gray-50 border border-gray-200 rounded-lg text-sm text-gray-700
                          focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500
                          hover:border-gray-300 transition-colors
                          [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none">
        </div>
        <div class="flex items-center gap-2 pb-0.5">
            <button type="reset"
                    class="px-4 py-2.5 text-sm font-medium text-gray-500 hover:text-gray-700 hover:bg-gray-100 rounded-lg transition-colors"
                    onclick="this.closest('form').querySelectorAll('input').forEach(i => i.value=''); this.closest('form').querySelector('select').selectedIndex=0; htmx.trigger(this.closest('form'), 'change');">
                Limpiar
            </button>
        </div>
    </div>
</form>
